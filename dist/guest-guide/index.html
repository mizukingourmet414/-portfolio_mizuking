<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宿泊施設案内 | みずき</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f7f5ed; color: #26372b; font: 16px/1.8 "Hiragino Sans", "Yu Gothic", sans-serif; }
main { width: min(1120px, calc(100% - 48px)); margin: 32px auto 56px; }
h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: clamp(30px, 4vw, 47px); line-height: 1.3; margin-bottom: 8px; }
a { color: inherit; text-underline-offset: 4px; }
a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; margin-top: 30px; }
figure { margin: 0; }
img { display: block; width: 100%; height: auto; border-radius: 4px; }
figcaption { margin-top: 8px; }
@media (max-width: 610px) { .gallery { grid-template-columns: 1fr; gap: 30px; } }
</style>
</head>
<body>
<main>
  <a href="../#works">← 作ったものに戻る</a>
  <h1>宿泊施設案内</h1>
  <p>一棟貸しヴィラの施設内の案内</p>
  <div class="gallery">
    <figure>
      <a href="cover.jpg"><img src="cover.jpg" width="376" height="532" alt="生成りの表紙に GUEST GUIDE と記したデザイン"></a>
      <figcaption>表紙</figcaption>
    </figure>
    <figure>
      <a href="house-rules.jpg"><img src="house-rules.jpg" width="376" height="532" alt="禁煙や静かに過ごす時間などを日英で案内したページ"></a>
      <figcaption>滞在中のご案内</figcaption>
    </figure>
    <figure>
      <a href="nature.jpg"><img src="nature.jpg" width="376" height="532" alt="周囲の自然や生き物、虫除けの備品を日英で紹介したページ"></a>
      <figcaption>自然と生き物について</figcaption>
    </figure>
  </div>
</main>
</body>
</html>
